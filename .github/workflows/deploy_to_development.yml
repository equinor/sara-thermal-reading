name: Deploy to Development

concurrency:
  group: development-concurrency
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "train/**"

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: equinor/armada/.github/workflows/deploy_to_development.yml@main
    with:
      registry: roboticsdevacr.azurecr.io
      image_name: robotics/sara-thermal-reading
      push_to_ghcr: true
      infrastructure_repository: equinor/robotics-infrastructure
      kustomization_base_path: k8s_kustomize/analytics/overlays
      environment_name: Development
      # Authenticate to the registry with a federated credential instead
      # of the registry password. The environment below is what the OIDC
      # subject binds to on the Azure side.
      use_oidc: true
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets:
      deploy_key: ${{ secrets.ANALYTICS_INFRASTRUCTURE_DEPLOY_KEY }}
