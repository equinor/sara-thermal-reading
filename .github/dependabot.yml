version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Bundle all Python version updates into a single weekly PR.
      python-dependencies:
        patterns: ["*"]
        applies-to: version-updates

  # Docker base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      # Handle Python major base-image updates manually.
      - dependency-name: python
        update-types:
          - version-update:semver-major

  # GitHub Actions dependencies.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
