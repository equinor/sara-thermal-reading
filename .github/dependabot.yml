version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock).
  # Replaces the compile_python_requirements_and_create_pr workflow.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Bundle patch + minor bumps into a single weekly PR. Cooldown (native
      # 3-day default) prevents just-released versions from being included.
      python-patch-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      # Group major bumps separately from patch + minor updates for review.
      python-major:
        patterns: ["*"]
        update-types: ["major"]

  # Docker base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      # Handle Python major base-image updates manually.
      - dependency-name: python
        update-types:
          - version-update:semver-major
